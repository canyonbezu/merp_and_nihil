  <div id="lightbox">
    <span id="close">&times;</span>
    <span class="nav" id="prev">&#10094;</span>
    <img src="" alt="Full size artwork">
    <span class="nav" id="next">&#10095;</span>
  </div>

<script>
  const links = Array.from(document.querySelectorAll('.gallery a.gal'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  let current = 0;

  function show(i) {
    current = (i + links.length) % links.length;
    lightboxImg.src = links[current].href;
    lightbox.classList.add('active');
  }
  function hide() { lightbox.classList.remove('active'); lightboxImg.src = ''; }

  links.forEach((link, i) => link.addEventListener('click', e => {
    e.preventDefault();
    show(i);
  }));

  document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); show(current - 1); });
  document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); show(current + 1); });
  document.getElementById('close').addEventListener('click', hide);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) hide(); });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'ArrowRight') show(current + 1);
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'Escape') hide();
  });
</script>
